name: CI

# The nix half: the plugin as the host loads it. unit-tests.yml runs the engine under
# --no-default-features, which drops the module glue and the SDK.

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: nix build
    # ATTIC_TOKEN_PUBLIC only exists in the public-cache environment.
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Build plugin and package
        # `lgx` is the plugin plus packaging; `default` adds the generated consumer API.
        run: nix build -L .#lgx .#default

  windows:
    # The cross build on Linux, the PE and import-closure gates and the hand-off live in
    # logos-co/logos-windows-ci. No smoke: a module plugin has no entry point of its own.
    uses: logos-co/logos-windows-ci/.github/workflows/windows-ci.yml@v1
    secrets: inherit
    with:
      targets: default
      # Not yet measured for this crate graph; the Zcash core's figure as a start.
      cold-derivation-budget: 340
