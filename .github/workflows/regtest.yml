name: Bitcoin regtest

# The engine end to end against tools/regtest/chain.sh: three filter-serving bitcoind and two
# electrs, with an in-process signer manager over logos-signer-interface's mock signer. One run
# with the Electrum header chain as the authority and a doctoring proxy in front of one electrs,
# one with Kyoto as the authority behind P2P proxies the test steers, one with a pruned local
# node, and one with Blockstream's electrs for the Esplora path. Pinned nixpkgs: Bitcoin Core 31.1
# and electrs 0.11.0, as in the signer manager's harness.

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  group: regtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regtest:
    name: open, receive, send, bump, reorg, doctored answers, Kyoto, a pruned node, Esplora
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the SDK revision the builder pins
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          rev=$(jq -r '.nodes as $n | ($n[.root].inputs["logos-module-builder"]) as $b
                       | $n[$n[$b].inputs["logos-rust-sdk"]].locked.rev' flake.lock)
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: logos-co/logos-rust-sdk
          ref: ${{ steps.sdk.outputs.rev }}
          path: logos-rust-sdk-src

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-lib

      - uses: cachix/install-nix-action@v31

      - name: Start the chain
        run: |
          pkgs=github:NixOS/nixpkgs/39ad350a0602fa0a58a544344e3e9187526ea45c
          echo "BITCOIND=$(nix build $pkgs#bitcoind --no-link --print-out-paths)/bin/bitcoind" >> "$GITHUB_ENV"
          echo "ELECTRS=$(nix build $pkgs#electrs --no-link --print-out-paths)/bin/electrs" >> "$GITHUB_ENV"
          echo "CHAIN_DIR=$RUNNER_TEMP/chain" >> "$GITHUB_ENV"

      - name: Run the engine on regtest, the Electrum header chain the authority
        run: |
          tools/regtest/chain.sh prepare
          cd rust-lib
          REGTEST_RPC=http://127.0.0.1:18543 REGTEST_COOKIE="$CHAIN_DIR/bitcoind/regtest/.cookie" \
          REGTEST_ELECTRUM=127.0.0.1:60601,127.0.0.1:60611 REGTEST_CHAIN="$GITHUB_WORKSPACE/tools/regtest/chain.sh" \
            cargo test --release --no-default-features --features test-hooks --locked --test regtest -- --ignored --nocapture

      - name: Close the wallet during a slow header download, on the same chain
        run: |
          cd rust-lib
          REGTEST_RPC=http://127.0.0.1:18543 REGTEST_COOKIE="$CHAIN_DIR/bitcoind/regtest/.cookie" \
          REGTEST_ELECTRUM=127.0.0.1:60601 REGTEST_CHAIN="$GITHUB_WORKSPACE/tools/regtest/chain.sh" \
            cargo test --release --no-default-features --features test-hooks --locked --test close -- --ignored --nocapture

      - name: Run the engine on regtest, Kyoto the authority
        run: |
          tools/regtest/chain.sh stop
          rm -rf "$CHAIN_DIR"
          tools/regtest/chain.sh prepare
          cd rust-lib
          export REGTEST_RPC=http://127.0.0.1:18543 REGTEST_COOKIE="$CHAIN_DIR/bitcoind/regtest/.cookie" \
            REGTEST_ELECTRUM=127.0.0.1:60601 REGTEST_CHAIN="$GITHUB_WORKSPACE/tools/regtest/chain.sh"
          for t in kyoto_is_the_authority_on_regtest kyoto_with_a_history_server; do
            cargo test --release --no-default-features --features test-hooks --locked --test kyoto -- --ignored --exact "$t" --nocapture
          done

      - name: Run the engine on regtest, a pruned local node the authority
        run: |
          tools/regtest/chain.sh stop
          rm -rf "$CHAIN_DIR"
          tools/regtest/chain.sh prepare
          cd rust-lib
          REGTEST_RPC=http://127.0.0.1:18543 REGTEST_COOKIE="$CHAIN_DIR/bitcoind/regtest/.cookie" \
          REGTEST_ELECTRUM=127.0.0.1:60601 REGTEST_CHAIN="$GITHUB_WORKSPACE/tools/regtest/chain.sh" \
            cargo test --release --no-default-features --features test-hooks --locked --test node -- --ignored --nocapture

      - name: Wallets share the network's headers, and a damaged store is rebuilt, on the same chain
        run: |
          cd rust-lib
          REGTEST_RPC=http://127.0.0.1:18543 REGTEST_COOKIE="$CHAIN_DIR/bitcoind/regtest/.cookie" \
          REGTEST_ELECTRUM=127.0.0.1:60601 REGTEST_CHAIN="$GITHUB_WORKSPACE/tools/regtest/chain.sh" \
            cargo test --release --no-default-features --features test-hooks --locked --test shared_headers -- --ignored --nocapture

      - name: Run the engine on regtest, Esplora for history, broadcast and fees
        run: |
          esplora=$(nix build .#esplora-electrs --no-link --print-out-paths)/bin/electrs
          tools/regtest/chain.sh stop
          rm -rf "$CHAIN_DIR"
          tools/regtest/chain.sh prepare
          cd rust-lib
          ESPLORA="$esplora" REGTEST_RPC=http://127.0.0.1:18543 REGTEST_COOKIE="$CHAIN_DIR/bitcoind/regtest/.cookie" \
          REGTEST_ELECTRUM=127.0.0.1:60601 REGTEST_CHAIN="$GITHUB_WORKSPACE/tools/regtest/chain.sh" \
            cargo test --release --no-default-features --features test-hooks --locked --test esplora -- --ignored --nocapture

      - name: Stop the chain
        if: always()
        run: tools/regtest/chain.sh stop
