[package]
name = "bitcoin_wallet_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

# Standalone crate: keeps cargo from adopting a workspace in a parent directory. The vendored
# bip157 is a patched dependency, not a member.
[workspace]
exclude = ["vendor"]

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# The BDK cohort: bdk_wallet 3.2.0 pins bdk_chain 0.23.3, whose store pins rusqlite 0.31.
bdk_wallet = { version = "=3.2.0", features = ["rusqlite"] }
bdk_electrum = { version = "=0.24.0", default-features = false, features = ["use-rustls-ring"] }
bdk_esplora = { version = "=0.22.2", default-features = false, features = ["std", "async-https-rustls", "tokio"] }
bitcoin = { version = "0.32", features = ["serde", "base64", "rand-std"] }
# Kyoto, the light client: bdk_kyoto 0.18.0 on bip157 0.7.0 with our patches (see [patch] below).
bdk_kyoto = "=0.18.0"
# The local node: bitcoind_module's rpc over Logos IPC behind bitcoincore_rpc's RpcApi.
bdk_bitcoind_rpc = "=0.22.0"
# Pinned certificates: our own verifier on the rustls that electrum-client and esplora-client's
# reqwest use; a pinned Esplora server gets a reqwest client of ours with that verifier.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "socks"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
sha2 = "0.10"
sha3 = "0.10"

# Storage: BDK's rusqlite, switched to SQLCipher for the whole graph.
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
zeroize = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

# Provided by logos-module-builder at build time (staged into ../logos-rust-sdk-src).
logos-rust-sdk = { path = "../logos-rust-sdk-src", optional = true }

# Apple uses CommonCrypto for SQLCipher; elsewhere OpenSSL is vendored.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile = "3"
logos-signer-interface = { git = "https://github.com/logos-co/logos-signer-interface", rev = "a80206330ae18be12710fac83c1b2feb73a96dc9", features = ["mock"] }

[features]
default = ["logos_module"]
logos_module = ["dep:logos-rust-sdk"]
# Fault injection for the integration tests; never in a module build.
test-hooks = []

# These drive the engine through test-only hooks; without the feature they are skipped.
[[test]]
name = "kyoto"
required-features = ["test-hooks"]

[[test]]
name = "rpc"
required-features = ["test-hooks"]

[[test]]
name = "node"
required-features = ["test-hooks"]

[[test]]
name = "esplora"
required-features = ["test-hooks"]

[[test]]
name = "restore"
required-features = ["test-hooks"]

[[test]]
name = "widen"
required-features = ["test-hooks"]

[[test]]
name = "anchors"
required-features = ["test-hooks"]

[[test]]
name = "gap"
required-features = ["test-hooks"]

[[test]]
name = "peers"
required-features = ["test-hooks"]

# bip157 0.7.0 as published plus patches/bip157, held to an allowlist (tools/kyoto, README).
[patch.crates-io]
bip157 = { path = "vendor/bip157" }
# bdk_kyoto 0.18.0 plus patches/bdk_kyoto, held to tools/kyoto/patch-bdk_kyoto.sh's allowlist.
bdk_kyoto = { path = "vendor/bdk_kyoto" }

[profile.release]
panic = "unwind"
